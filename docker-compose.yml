services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: barcodepos-sqlserver
    hostname: barcodepos-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "BarcodePos_Dev2025!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "BarcodePos_Dev2025!" -C -Q "SELECT 1" -b
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  sqlserver-data:
    driver: local
